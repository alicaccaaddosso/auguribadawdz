<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Photos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="photos-page">
    <!-- ===================== PAGINA FOTO CON POLAROID ===================== -->
    <!-- Galleria di foto Polaroid vintage animate:
         - Fino a 8 foto con didascalie
         - Hover effects: ingrandimento e effetto 3D tilt
         - Animazioni di caricamento staggered
         - Back button ritorna a surprise.html
         
         PERSONALIZZAZIONE: Sostituisci i link foto e le didascalie
    ===================================================================== -->
    <a href="surprise.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    
    <div class="birthday-backdrop">Happy Birthday</div>
    
    <div class="photos-container">
        <!-- ===================== PERSONALIZZAZIONE FOTO ===================== -->
        <!-- Aggiungi fino a 8 foto polaroid. Per ogni foto:
             1. Sostituisci [LINK_FOTO_X] con il link della tua foto
             2. Modifica il caption (testo sotto la foto) con una didascalia a piacere
             3. Il formato accettato: URL di immagine (JPG, PNG, WebP)
             Esempio: https://example.com/myfoto.jpg
        ========================================================================= -->
        <div class="polaroids-grid">
            <!-- Polaroid 1 -->
            <div class="polaroid">
                <img src="[LINK_FOTO_1]" alt="Birthday Photo 1">
                <div class="polaroid-caption">You & Me</div>
            </div>
            
            <!-- Polaroid 2 -->
            <!-- SOSTITUISCI [LINK_FOTO_2] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_2]" alt="Birthday Photo 2">
                <div class="polaroid-caption">Beautiful Moment</div>
            </div>
            
            <!-- Polaroid 3 -->
            <!-- SOSTITUISCI [LINK_FOTO_3] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_3]" alt="Birthday Photo 3">
                <div class="polaroid-caption">Smile ✨</div>
            </div>
            
            <!-- Polaroid 4 -->
            <!-- SOSTITUISCI [LINK_FOTO_4] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_4]" alt="Birthday Photo 4">
                <div class="polaroid-caption">Together</div>
            </div>
            
            <!-- Polaroid 5 -->
            <!-- SOSTITUISCI [LINK_FOTO_5] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_5]" alt="Birthday Photo 5">
                <div class="polaroid-caption">Happy Times</div>
            </div>
            
            <!-- Polaroid 6 -->
            <!-- SOSTITUISCI [LINK_FOTO_6] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_6]" alt="Birthday Photo 6">
                <div class="polaroid-caption">Forever Memories</div>
            </div>
            
            <!-- Polaroid 7 (opzionale) -->
            <!-- SOSTITUISCI [LINK_FOTO_7] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_7]" alt="Birthday Photo 7">
                <div class="polaroid-caption">Special Day</div>
            </div>
            
            <!-- Polaroid 8 (opzionale) -->
            <!-- SOSTITUISCI [LINK_FOTO_8] con il link della tua foto -->
            <div class="polaroid">
                <img src="[LINK_FOTO_8]" alt="Birthday Photo 8">
                <div class="polaroid-caption">Love You ❤️</div>
            </div>
        </div>
    </div>
    
    <script src="../js/script.js"></script>
</body>
</html>
