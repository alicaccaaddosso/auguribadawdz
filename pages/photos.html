<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Photos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="photos-page">
    <!-- ===================== PAGINA FOTO CON POLAROID ===================== -->
    <!-- Galleria di foto Polaroid vintage animate:
         - Fino a 8 foto con didascalie
         - Hover effects: ingrandimento e effetto 3D tilt
         - Animazioni di caricamento staggered
         - Back button ritorna a surprise.html
         
         PERSONALIZZAZIONE: Sostituisci i link foto e le didascalie
    ===================================================================== -->
    <a href="surprise.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    
    <div class="birthday-backdrop">Happy Birthday</div>
    
    <div class="photos-container">
        <!-- ===================== PERSONALIZZAZIONE FOTO ===================== -->
        <!-- Aggiungi fino a 8 foto polaroid. Per ogni foto:
             1. Sostituisci [LINK_FOTO_X] con il link della tua foto
             2. Modifica il caption (testo sotto la foto) con una didascalia a piacere
             3. Il formato accettato: URL di immagine (JPG, PNG, WebP)
             Esempio: https://example.com/myfoto.jpg
        ========================================================================= -->
        <div class="polaroids-grid">
            <div class="poppo">
                <!-- Polaroid 1 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/a.jpg" alt="Birthday Photo 1">
                    <div class="polaroid-caption"></div>
                </div>
                
                <!-- Polaroid 2 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/b.jpg" alt="Birthday Photo 2">
                    <div class="polaroid-caption"></div>
                </div>
                
                <!-- Polaroid 3 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/c.png" alt="Birthday Photo 3">
                    <div class="polaroid-caption"></div>
                </div>
            </div>
            
            <div class="poppo2">
                <!-- Polaroid 4 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/d.jpg" alt="Birthday Photo 4">
                    <div class="polaroid-caption"></div>
                </div>
                
                <!-- Polaroid 5 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/e.png" alt="Birthday Photo 5">
                    <div class="polaroid-caption"></div>
                </div>
                
                <!-- Polaroid 6 -->
                <div class="polaroid">
                    <div class="photo-cover">❓</div>
                    <img src="../images/f.png" alt="Birthday Photo 6">
                    <div class="polaroid-caption"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/script.js"></script>
</body>
</html>
